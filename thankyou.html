<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050b12">
  <title>Message Sent | Adam Naumovski</title>
  <link rel="icon" type="image/png" href="images/logo_lo.png">
  <link rel="stylesheet" href="shared.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="script.js" defer></script>
  <style>
    .thanks-main{min-height:calc(100svh - 104px);display:grid;place-items:center;padding:70px 0}.thanks-card{width:min(720px,calc(100% - 28px));padding:clamp(32px,7vw,72px);text-align:center}.thanks-icon{width:78px;aspect-ratio:1;margin:0 auto 26px;display:grid;place-items:center;border:1px solid rgba(75,228,165,.42);border-radius:24px;color:var(--success);background:rgba(75,228,165,.09);font-size:2.5rem;box-shadow:0 0 44px rgba(75,228,165,.13)}.thanks-card h1{margin:0;font-size:clamp(2.6rem,7vw,5.4rem);line-height:1}.thanks-card p{max-width:560px;margin:22px auto 30px;color:var(--muted);font-size:1.05rem}.thanks-card .button-row{justify-content:center}
  </style>
</head>
<body>
  <main class="thanks-main">
    <section class="thanks-card card reveal is-visible" aria-labelledby="thanks-title">
      <div class="thanks-icon"><i class="bx bx-check" aria-hidden="true"></i></div>
      <p class="eyebrow">Message delivered</p>
      <h1 id="thanks-title">Thanks for reaching out.</h1>
      <p>Your message has been sent successfully. I’ll review it and get back to you as soon as I can.</p>
      <div class="button-row"><a class="btn" href="index.html">Return to portfolio</a><a class="btn btn--secondary" href="index.html#work">View projects</a></div>
    </section>
  </main>
  <footer class="site-footer"><div class="footer-shell"><p>© <span data-year>2026</span> Adam Naumovski.</p><div class="footer-links"><a href="index.html">Home</a></div></div></footer>
</body>
</html>
